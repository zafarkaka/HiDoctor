name: ConvertRocket Keep-Alive
run-name: Deep Wake Ping by ${{ github.actor }}

on:
  schedule:
    - cron: '*/5 * * * *' 
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Humanized Render Wake-up
        run: |
          # Jitter to avoid landing exactly on the :00 second mark
          sleep $((RANDOM % 30))

          URL="https://hidoctor-xreb.onrender.com/"
          TIMESTAMP=$(date +%s)
          
          # Randomized Referrers for log variety
          REFERRERS=("https://www.google.com/" "https://www.bing.com/" "https://duckduckgo.com/" "https://t.co/")
          SELECTED_REF=${REFERRERS[$RANDOM % ${#REFERRERS[@]}]}

          curl -f -L -s \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -e "$SELECTED_REF" \
            --retry 2 \
            --connect-timeout 20 \
            -o /dev/null \
            "$URL?utm_source=organic&v=$TIMESTAMP"
          
          echo "Ping sent at $(date)"
