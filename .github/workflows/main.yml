name: ConvertRocket Keep-Alive
run-name: Deep Wake Ping by ${{ github.actor }}

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Humanized Render Wake-up (Multi Ping)
        run: |
          URL="https://hidoctor-xreb.onrender.com/api/health"
          REFERRERS=("https://www.google.com/" "https://www.bing.com/" "https://duckduckgo.com/")

          for i in {1..5}; do
            TIMESTAMP=$(date +%s)
            SELECTED_REF=${REFERRERS[$RANDOM % ${#REFERRERS[@]}]}

            echo "Ping #$i at $(date)"

            curl -L -s \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              -e "$SELECTED_REF" \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              -o /dev/null \
              -w "Status: %{http_code}\n" \
              "$URL?utm_source=organic&v=$TIMESTAMP"

            sleep 60   # wait 1 minute between pings
          done
